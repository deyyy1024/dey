<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
    <style>
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes sparkle {
        0% { opacity: 0; r: 0; }
        50% { opacity: 1; r: 3; }
        100% { opacity: 0; r: 0; }
      }
      
      @keyframes explode {
        0% { opacity: 0; r: 0; }
        40% { opacity: 1; r: 8; }
        100% { opacity: 0; r: 12; }
      }
      
      @keyframes shoot {
        from { transform: translateY(700px); }
        to { transform: translateY(0px); }
      }
      
      @keyframes letterPop {
        0% { transform: scale(0); opacity: 0; }
        60% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      
      @keyframes glow {
        0% { filter: drop-shadow(0 0 2px #fff); }
        50% { filter: drop-shadow(0 0 10px #ff0); }
        100% { filter: drop-shadow(0 0 2px #fff); }
      }
      
      @keyframes moveStar {
        0% { transform: translate(0, 0); }
        25% { transform: translate(5px, 5px); }
        50% { transform: translate(0, 10px); }
        75% { transform: translate(-5px, 5px); }
        100% { transform: translate(0, 0); }
      }
      
      @keyframes colorCycle {
        0% { fill: #ff3366; }
        25% { fill: #33ff66; }
        50% { fill: #3366ff; }
        75% { fill: #ff9933; }
        100% { fill: #ff3366; }
      }
      
      .background {
        fill: #001733;
        animation: fadeIn 2s;
      }
      
      .star {
        fill: white;
        animation: sparkle 3s infinite alternate, moveStar 8s infinite ease-in-out;
      }
      
      .rocket {
        animation: shoot 1.5s ease-out forwards;
      }
      
      .rocket-trail {
        fill: #ffcc00;
      }
      
      .explosion {
        animation: explode 2s infinite;
      }
      
      .letter {
        font-family: "Arial Black", Impact, sans-serif;
        font-size: 40px;
        fill: #ffcc00;
        text-anchor: middle;
        animation: letterPop 1s ease-out forwards, glow 3s infinite;
      }
      
      .first-name { animation-delay: 2s, 3s; }
      .middle-name { animation-delay: 2.3s, 3.3s; }
      .last-name-1 { animation-delay: 2.6s, 3.6s; }
      .last-name-2 { animation-delay: 2.9s, 3.9s; }
      
      .firework-particle {
        animation: explode 1.2s infinite;
      }
  
      .special-particle {
        animation: explode 1.5s infinite, colorCycle 5s infinite;
      }
    </style>
